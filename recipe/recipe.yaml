schema_version: 1

context:
  version: "0.9.2"

package:
  name: rotary-embedding-torch
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/r/rotary-embedding-torch/rotary_embedding_torch-${{ version }}.tar.gz
  sha256: 5eb7c8e899af5fb3cfa24f9e5902663183ef77c9e3fa55f478d0de34d183431b

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - einops >=0.8
    - pytorch >=2.4

tests:
  - python:
      imports:
        - rotary_embedding_torch
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: Rotary Embedding - Pytorch
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/lucidrains/rotary-embedding-torch

extra:
  recipe-maintainers:
    - leightonpayne
    - synapticarbors
